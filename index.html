const loaded={};
function load(t){if(loaded[t])return;const html=b64utf8(PAGES[t]);const blob=new Blob([html],{type:'text/html;charset=utf-8'});document.getElementById('f-'+t).src=URL.createObjectURL(blob);loaded[t]=true;}
load('shiori');
document.querySelector('.load').style.display='none';
document.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{const t=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.stage iframe').forEach(f=>f.classList.remove('on'));load(t);document.getElementById('f-'+t).classList.add('on');window.scrollTo(0,0);};});
